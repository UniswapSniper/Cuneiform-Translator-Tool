services:
  - type: web
    name: cuneiform-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: cuneiform-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://cuneiform-translator-tool.vercel.app,https://cuneiform-translator-tool-*.vercel.app
      - key: SOCKETIO_ASYNC_MODE
        value: threading

databases:
  - name: cuneiform-db
    databaseName: cuneiform_translator
    user: cuneiform
    region: oregon

jobs:
  - type: render_cron
    name: db-backup
    startCommand: "echo 'Backup scheduled (implement backup logic as needed)'"
    schedule: 0 2 * * *
