services:
  - type: web
    name: cuneiform-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install gunicorn gevent gevent-websocket
    startCommand: gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 -b 0.0.0.0:$PORT --timeout 120 --access-logfile - wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: cuneiform-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://cuneiform-translator-tool.vercel.app,https://cuneiform-translator-tool-*.vercel.app
      - key: SOCKETIO_ASYNC_MODE
        value: gevent

databases:
  - name: cuneiform-db
    databaseName: cuneiform_translator
    user: cuneiform
    region: oregon

jobs:
  - type: render_cron
    name: db-backup
    startCommand: "echo 'Backup scheduled (implement backup logic as needed)'"
    schedule: 0 2 * * *
